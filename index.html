<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EcoFood</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<div class="logo">EcoFood</div>

<nav>
<ul>
<li><a href="#all">Todos</a></li>
<li><a href="#impact">Impacto</a></li>
<li><a href="#profile">Perfil</a></li>
</ul>
</nav>
</header>

<section class="hero">
<div>
<h1>Salva comida. Ayuda al planeta.</h1>
<p>Plataforma para reducir el desperdicio alimentario.</p>
<button id="btnScroll">Ver restaurantes</button>
</div>
</section>

<section class="search">
<input type="text" id="search" placeholder="Buscar restaurante...">
</section>

<section class="stats">
<div class="card"><h2 id="food">0</h2><p>Kg comida</p></div>
<div class="card"><h2 id="co2">0</h2><p>CO₂</p></div>
<div class="card"><h2 id="users">0</h2><p>Usuarios</p></div>
</section>

<!-- APARTADO TODOS LOS RESTAURANTES -->
<section id="all">
<h2>Todos los restaurantes</h2>

<div class="offers-container" id="offersContainer"></div>
</section>

<section id="impact" class="impact">
<h2>Impacto ambiental</h2>
<div class="box">Reducimos el desperdicio de comida.</div>
</section>

<section id="profile" class="profile">
<h2>Perfil</h2>
<div class="profile-box">
Reservas: 12<br>
Comida salvada: 35kg
</div>
</section>

<nav class="bottom-nav">
<button>Inicio</button>
<button>Todos</button>
<button>Perfil</button>
</nav>

<script src="script.js"></script>

</body>
</html>
