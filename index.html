<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoFood</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- SPLASH -->
<section id="splash" class="screen active-screen">
    <div class="center">
        <h1>EcoFood</h1>
        <button id="startApp">Començar</button>
    </div>
</section>

<!-- LOGIN -->
<section id="login" class="screen">
    <div class="container">
        <h2>Iniciar sessió</h2>
        <input id="loginEmail" placeholder="Email">
        <input id="loginPass" type="password" placeholder="Contrasenya">
        <button id="loginBtn">Entrar</button>
    </div>
</section>

<!-- HOME -->
<section id="home" class="screen">

    <div class="container">

        <h2>Ofertes</h2>

        <input id="search" placeholder="Buscar...">

        <div class="filters">
            <button class="filter active" data-type="Tots">Tots</button>
            <button class="filter" data-type="Restaurant">Restaurants</button>
            <button class="filter" data-type="Fleca">Fleques</button>
            <button class="filter" data-type="Supermercat">Supermercats</button>
        </div>

        <div id="list"></div>

    </div>

</section>

<!-- DETAIL -->
<section id="detail" class="screen">
    <div class="container">

        <button id="back">← Tornar</button>

        <img id="img" />
        <h2 id="name"></h2>
        <p id="desc"></p>
        <h3 id="price"></h3>

        <button id="reserve">Reservar</button>

    </div>
</section>

<!-- PERFIL -->
<section id="profile" class="screen">

    <div class="container">

        <h2>Perfil</h2>

        <div id="userBox"></div>

        <input id="pEmail" placeholder="Email">
        <input id="pPass" type="password" placeholder="Contrasenya">

        <button id="saveUser">Guardar login</button>

        <button id="logout">Tancar sessió</button>

    </div>

</section>

<!-- NAV -->
<nav class="nav">
    <button data-go="home">Inici</button>
    <button data-go="profile">Perfil</button>
</nav>

<script src="script.js"></script>
</body>
</html>
